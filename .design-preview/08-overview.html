/* 概览的专属部分：一屏「今天做什么」的告示 + 数据条 */
.notice{
  max-width:1360px;margin:0 auto;padding:26px 40px 0;position:relative;z-index:1;
}
.notice-in{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:26px;flex-wrap:wrap;
  padding:20px 0;border-bottom:1px solid var(--rule);
}
.notice-l{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.notice-title{
  font-family:var(--serif);font-size:24px;font-weight:600;
  letter-spacing:.01em;line-height:1.35;
}
.notice-title .step{color:var(--mark)}
.notice-desc{font-size:13.5px;color:var(--ink-3);line-height:1.8}
.notice-actions{display:flex;gap:22px;font-size:13px;flex:none;align-items:baseline}
.notice-actions button{
  background:none;border:0;font-family:inherit;font-size:13px;cursor:pointer;
  color:var(--ink-3);border-bottom:1px solid transparent;transition:all .18s;padding:0;
}
.notice-actions button:hover{color:var(--ink);border-bottom-color:var(--ink-4)}
.notice-actions button.go{color:var(--mark);font-weight:600}
.notice-actions button.go:hover{border-bottom-color:var(--mark)}

/* 数据：一行，用竖线切分，不用卡片 */
.figures{
  display:flex;flex-wrap:wrap;gap:0;
  padding:20px 0 4px;
}
.fig{
  padding:0 30px;border-left:1px solid rgba(17,17,17,.1);
  display:flex;align-items:baseline;gap:10px;
}
.fig:first-child{padding-left:0;border-left:0}
.fig-n{
  font-family:var(--serif);font-size:30px;font-weight:600;
  line-height:1;letter-spacing:-.01em;
}
.fig-n.dim{color:var(--ink-4)}
.fig-l{font-size:11.5px;color:var(--ink-3)}
.fig-sub{font-size:10.5px;color:var(--ink-4);font-family:var(--mono)}
</style>
</head>
